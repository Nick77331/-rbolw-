<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Bowl - Play Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        h1 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .game-container {
            position: relative;
            width: 95vw;
            max-width: 960px;
            height: 54vw;
            max-height: 540px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .fullscreen-btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .fullscreen-btn:hover {
            background-color: #b80710;
        }
    </style>
</head>
<body>

    <h1>Retro Bowl</h1>

    <div class="game-container" id="gameBox">
        <!-- Using a stable, web-hosted build of the HTML5 game -->
        <iframe src="https://zayaruzostreetorgan.com/uploads/5/5/6/7/5567194/custom_themes/226112567625258737/files/index.html" scrolling="no" allowtransparency="true" allowfullscreen></iframe>
    </div>

    <button class="fullscreen-btn" onclick="openFullscreen()">GO FULLSCREEN</button>

    <script>
        function openFullscreen() {
            var elem = document.getElementById("gameBox");
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
