<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Bowl - Single File Test</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background-color: #111;
    }
  </style>
</head>
<body>
  <!-- Canvas for your game -->
  <canvas id="gameCanvas" width="960" height="540"></canvas>

  <!-- Your game script -->
  <script>
    // Replace this with your actual game code
    // For example, your game initialization function:
    function GameMaker_Init() {
      const ctx = document.getElementById('gameCanvas').getContext('2d');
      ctx.fillStyle = 'white';
      ctx.font = '30px Arial';
      ctx.fillText('Game script loaded!', 300, 270);

      // Your actual game code should go here
      // e.g., initialize game objects, start game loop, etc.
    }
  </script>

  <!-- Load your game script here -->
  <!-- If your game code is external, replace the above with: -->
  <!-- <script src="path/to/your/game.js"></script> -->

  <script>
    window.onload = function() {
      if (typeof GameMaker_Init === 'function') {
        GameMaker_Init();
      } else {
        const ctx = document.getElementById('gameCanvas').getContext('2d');
        ctx.fillStyle = 'red';
        ctx.font = '20px Arial';
        ctx.fillText('Game script NOT loaded!', 300, 270);
      }
    };
  </script>
</body>
</html>
